# Copy of the Elestio preview reverse proxy (dev) — docs/runbook.md "Preview (dev)".
# Live file: /opt/elestio/nginx/conf.d/vigorcollect-u57586.vm.elestio.app.conf (NOT in any git;
# it disappears with the server). Changes vs. the Elestio default: proxy_pass → the collect app
# (172.17.0.1:13000, was the landing page :46455), X-Forwarded-Proto https, X-Request-Id passed.
# No secrets: only file paths (certificates live in /etc/nginx/certs inside elestio-nginx).
# Copied 2026-10-12.

#CVE-2025-55182 Mitigation
map $http_next_action $has_next_action {
    default 0;
    "~.+"   1;
}
map $http_rsc_action_id $has_rsc_action {
    default 0;
    "~.+"   1;
}

map $content_type $is_form_content {
    default                              0;
    "~*^multipart/form-data"             1;
    "~*^application/x-www-form-urlencoded" 1;
}
map "$has_next_action$has_rsc_action" $has_rsc_header {
    default 0;
    "~1"    1;  # Any "1" in string means at least one matched
}
map "$has_rsc_header$is_form_content" $is_rsc_form_request {
    default 0;
    "11"    1;  # Both must be 1
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

proxy_cache_path /tmp levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;
limit_req_zone $binary_remote_addr$http_x_forwarded_for zone=iprl:16m rate=1000000r/m;

server {
  listen 443 ssl;
  http2 on;
  ssl_certificate /etc/nginx/certs/cert.pem;
  ssl_certificate_key /etc/nginx/certs/key.pem;
  server_name vigorcollect-u57586.vm.elestio.app;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

  client_header_buffer_size 32k;
  large_client_header_buffers 4 64k;
  underscores_in_headers on;

  #access_log  /var/log/nginx/access_log;
  #error_log /var/log/nginx/error_log;
  
  include /usr/local/openresty/nginx/conf/error-pages.conf;

  location / {

    content_by_lua_block {
        ngx.header['server'] = 'Elestio'
    }
    access_by_lua_block {
        ngx.header['server'] = 'Elestio'
    }

    if ($is_rsc_form_request) {
      return 403;
    }


    

    limit_req zone=iprl burst=1000000 nodelay;
    limit_req_log_level warn;

    #proxy_cache_valid any 0s;
    #add_header X-Cache-Status $upstream_cache_status;
    #proxy_cache my_cache;
    #proxy_ignore_headers Cache-Control;
    #proxy_cache_methods GET HEAD;
    #proxy_cache_bypass $cookie_nocache $arg_nocache;
    #proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # Connection & timeout handling
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_connect_timeout 180s;
    keepalive_timeout 180s;

    proxy_http_version 1.1;
    # Preview → collect app (docker compose service `app`, /srv/vigor-collect); was landing-page :46455.
    proxy_pass http://172.17.0.1:13000;
    proxy_ssl_verify  off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # Correlation id passes through; the app generates one when it is missing or malformed.
    proxy_set_header X-Request-Id $http_x_request_id;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
    proxy_hide_header x-powered-by;

    proxy_set_header Authorization $http_authorization;
  }
}

