# Local development stack. Protected file (CLAUDE.md rule 13).
# Deploy: `docker compose up -d app` (never `restart` — it keeps the old image).
# Secrets per container (review S-04/S-10/S-11): app = vigor_app + auth/PII keys; worker = jobs +
# backup (public age key only); renderer = ONE credential (render_jobs); migrate and restore-test
# are one-shot services (profile ops) — the only places with vigor_migrate / the age identity.
name: collect

services:
  db:
    build:
      context: ./db
    restart: unless-stopped
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?set in .env}
    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${DB_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: app
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    # Generated documents (task 3.3): encrypted files shared with the worker (it writes the PDF).
    volumes:
      - documents:/srv/documents
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: UTC
      NODE_ENV: production
      PRODUCT_NAME: ${PRODUCT_NAME:?set in .env}
      DOCUMENTS_DIR: /srv/documents
      # Inside the compose network the DB host is `db`, not localhost.
      DATABASE_URL: postgres://vigor_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      # Review S-04: no MIGRATE_DATABASE_URL here — the owner of every table is not in a
      # long-running process (service `migrate`, profile ops).
      # Review S-07: reverse proxies that append to X-Forwarded-For (nginx = 1).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Secrets come from .env / the Elestio env panel (vault) — never from this file.
      PII_MASTER_KEYS: ${PII_MASTER_KEYS:?set in .env (docs/runbook.md)}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set in .env (docs/runbook.md)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set in .env}
      # Production refuses to start without Turnstile keys (ADR 0006); locally Cloudflare's
      # public test keys work.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?set in .env (docs/runbook.md)}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:?set in .env (docs/runbook.md)}
      # Optional (task 1.7): empty = Sentry off.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      # Risk provider (task 4.3): CheckPoint trial key; empty = not configured.
      CHECKPOINT_API_KEY: ${CHECKPOINT_API_KEY:-}
      # 5.3 (ADR 0007): Microsoft 365 mailbox consent; empty = the button is hidden.
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT: ${MS_TENANT:-common}
    ports:
      - '${APP_BIND_HOST:-127.0.0.1}:${APP_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  # Job runner (ADR 0005): same image, other command. Not published; /health on 3001 inside.
  # Needs the role vigor_worker (scripts/create-service-roles.sh) before migration 007.
  # Review S-10: no Chromium here any more — the renderer service renders, the worker encrypts.
  worker:
    build:
      context: .
      # Worker stage = app image + pg_dump/pg_restore 16 + rclone + age + Chromium (renderer).
      target: worker
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    command: ['node', 'worker.mjs']
    volumes:
      - backups:/srv/backups
      - documents:/srv/documents
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: UTC
      NODE_ENV: production
      PRODUCT_NAME: ${PRODUCT_NAME:?set in .env}
      WORKER_PORT: '3001'
      DOCUMENTS_DIR: /srv/documents
      # Risk provider (task 4.3): the daily risk job runs here.
      CHECKPOINT_API_KEY: ${CHECKPOINT_API_KEY:-}
      DATABASE_URL: postgres://vigor_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      WORKER_DATABASE_URL: postgres://vigor_worker:${WORKER_DB_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB}
      # The mail dispatcher decrypts mail_outbox once SMTP exists (ADR 0003, 0005).
      PII_MASTER_KEYS: ${PII_MASTER_KEYS:?set in .env (docs/runbook.md)}
      APP_HEALTH_URL: http://app:3000/health
      # 5.3 (ADR 0007): mailbox check + n8n provisioning per tenant, Microsoft 365 token refresh.
      # BETTER_AUTH_URL = the public origin for the inbound URL n8n calls back.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set in .env}
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT: ${MS_TENANT:-common}
      # Dev only: the local SMTP relay on the docker bridge (172.17.0.1); production leaves it empty.
      MAILBOX_ALLOW_PRIVATE_HOSTS: ${MAILBOX_ALLOW_PRIVATE_HOSTS:-}
      # Optional (task 1.7) — all empty = off / log only.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_SLACK_WEBHOOK_URL: ${ALERT_SLACK_WEBHOOK_URL:-}
      # Backup 02:00 UTC runs in this container (worker stage has pg_dump + rclone + age) as
      # vigor_backup (reads only, never the superuser). Review S-11: every file is encrypted to
      # the PUBLIC key BACKUP_AGE_RECIPIENT; the identity that decrypts never comes here (service
      # restore-test). Empty = the job logs why and the "backup missing" alarm fires.
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_DIR: ${BACKUP_DIR:-/srv/backups}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  # HTML → PDF (review S-10): the only container that starts Chromium (--no-sandbox, see
  # src/server/documents/pdf.ts). Same image as the worker. Its environment holds ONE credential:
  # RENDER_DATABASE_URL (vigor_renderer — SELECT/UPDATE on render_jobs, no other table; migration
  # 021). No PII key, no backup role, no volume, read-only filesystem, no capabilities.
  renderer:
    build:
      context: .
      target: worker
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    command: ['node', 'renderer.mjs']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    read_only: true
    tmpfs:
      - /tmp
    # Chromium uses /dev/shm; --disable-dev-shm-usage falls back to /tmp, this keeps it roomy.
    shm_size: 256m
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: UTC
      NODE_ENV: production
      HOME: /tmp
      CHROMIUM_PATH: /usr/bin/chromium
      RENDER_DATABASE_URL: postgres://vigor_renderer:${RENDERER_DB_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  # One-shot: migrations (rule 4) as vigor_migrate — the ONLY service with that role (review
  # S-04). `./scripts/migrate.sh [up|status|down NNN]` runs it:
  #   docker compose --profile ops run --rm --build migrate up
  migrate:
    profiles: ['ops']
    build:
      context: .
      target: worker
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: 'no'
    entrypoint: ['bash', 'ops/migrate.sh']
    command: ['up']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: UTC
      MIGRATE_DATABASE_URL: postgres://vigor_migrate:${MIGRATE_DB_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB}

  # One-shot: weekly restore test (rule 28) — host cron Sunday 03:00 UTC (docs/runbook.md):
  #   docker compose --profile ops run --rm restore-test
  # The ONLY place that holds BACKUP_AGE_IDENTITY (review S-11): never the worker.
  restore-test:
    profiles: ['ops']
    build:
      context: .
      target: worker
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: 'no'
    entrypoint: ['bash', 'ops/restore-test.sh']
    command: []
    volumes:
      - backups:/srv/backups:ro
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: UTC
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_DIR: /srv/backups
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
      BACKUP_AGE_IDENTITY: ${BACKUP_AGE_IDENTITY:-}

volumes:
  pgdata:
  # Local backup copies (30 daily + 12 monthly); the off-site copy goes through rclone.
  backups:
  # Generated documents and their PDFs, encrypted per tenant (task 3.2/3.3). Not in the DB
  # backup — S3 storage adapter later (BACKLOG); until then losing it loses document files.
  documents:
