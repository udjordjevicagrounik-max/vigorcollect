# Baseline project rules (CLAUDE.md). Run: semgrep scan --config .semgrep.yml --error
rules:
  - id: no-sql-raw
    languages: [typescript]
    severity: ERROR
    message: sql.raw() requires explicit approval in the task (rule 5).
    pattern: sql.raw(...)

  - id: no-sql-string-building
    languages: [typescript]
    severity: ERROR
    message: No string concatenation/interpolation in SQL — use parameters or the Drizzle builder (rule 5).
    pattern-either:
      - pattern: $DB.query("..." + $X, ...)
      - pattern: $DB.query($X + "...", ...)
      - pattern: $DB.query(`...${$X}...`, ...)

  - id: no-web-storage
    languages: [typescript]
    severity: ERROR
    message: Session and data never go to Web Storage (rule 16).
    pattern-either:
      - pattern: localStorage.$M(...)
      - pattern: sessionStorage.$M(...)
      - pattern: window.localStorage
      - pattern: window.sessionStorage

  - id: no-hex-color-in-components
    languages: [generic]
    severity: ERROR
    message: Use a semantic token from tailwind.config.ts, never a hex color.
    paths:
      include: [src/app/, src/components/]
    pattern-regex: '#[0-9a-fA-F]{3}(?:[0-9a-fA-F]{3}(?:[0-9a-fA-F]{2})?)?\b'

  - id: no-product-name-in-code
    languages: [generic]
    severity: ERROR
    message: The product name comes from config (rule 21); only the role names vigor_app / vigor_migrate / vigor_worker / vigor_backup / vigor_restore (ADR 0005) / vigor_renderer (review S-10) are allowed.
    paths:
      include: [src/, messages/, tests/, scripts/]
    pattern-regex: '(?i)vigor(?!_app|_migrate|_worker|_backup|_restore|_renderer)'

  - id: no-drizzle-kit-push
    languages: [generic]
    severity: ERROR
    message: drizzle-kit push is forbidden — migrations are hand-written SQL (rule 4).
    paths:
      include: [package.json, scripts/, lefthook.yml]
    pattern-regex: '(?m)^(?![ \t]*#).*drizzle-kit\s+push'

  - id: no-float-amounts
    languages: [generic]
    severity: ERROR
    message: Amounts never pass through a float (rule 18) — use src/server/fx/money.ts (toMinor / money / convert / formatMoney).
    paths:
      include: [src/, scripts/]
    pattern-regex: '(?i)\b(?:Number|parseFloat|parseInt|Math\.(?:round|floor|ceil))\s*\(\s*[\w.?!\[\]''"]*(?:amount|total|balance|exposure|overdue|paid|fx_?rate)|(?:amount|total|balance|exposure|overdue|paid|fx_?rate)\w*\)?\.toFixed\('

  - id: no-unescaped-like
    languages: [generic]
    severity: ERROR
    message: A LIKE / ILIKE pattern from input is built only by likeContains / likePrefix (src/server/db-like.ts), which escape \ % _ (5.1).
    paths:
      include: [src/, scripts/]
      exclude: [src/server/db-like.ts]
    pattern-regex: '`%\$\{|''%''\s*\+|\+\s*''%'''
